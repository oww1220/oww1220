name: GitHub Actual Stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-summary-cards.yml
      - .github/scripts/generate-github-stats.mjs
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-actual-github-stats
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate actual GitHub stats
        env:
          GH_STATS_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        run: node .github/scripts/generate-github-stats.mjs

      - name: Commit generated stats
        run: |
          git add github-stats

          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update actual GitHub stats"
          git push
