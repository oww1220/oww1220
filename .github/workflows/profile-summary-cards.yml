name: Update GitHub stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-summary-cards.yml
      - .github/scripts/generate-github-stats.mjs
  schedule:
    # Daily at 18:17 KST (09:17 UTC). GitHub may delay scheduled runs.
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update GitHub stats
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats
        env:
          # Fine-grained PAT: Metadata read and Contents read for selected repositories.
          GH_STATS_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        run: node .github/scripts/generate-github-stats.mjs

      - name: Commit generated stats
        run: |
          git add github-stats

          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update actual GitHub stats"
          git pull --rebase origin main
          git push origin main
